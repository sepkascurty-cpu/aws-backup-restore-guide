<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#527FFF"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="1000" height="880" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#232F3E">AWS Backup &amp; Restore — Centralized Backup Architecture</text>
  <text x="30" y="58" font-size="13" fill="#666">One plan protects EC2, RDS, EFS, DynamoDB &amp; S3 — immutable vaults, cross-region copy, rehearsed restores</text>

  <!-- ============ PRIMARY REGION ============ -->
  <rect x="20" y="80" width="620" height="560" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="36" y="106" font-size="15" font-weight="bold" fill="#232F3E">Primary Region — ap-southeast-1</text>

  <!-- AZ 1 dashed box -->
  <rect x="40" y="120" width="280" height="500" fill="#F2F8FF" stroke="#527FFF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="56" y="144" font-size="13" font-weight="bold" fill="#527FFF">Availability Zone 1</text>

  <!-- AZ 2 dashed box -->
  <rect x="340" y="120" width="280" height="500" fill="#F2F8FF" stroke="#527FFF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="356" y="144" font-size="13" font-weight="bold" fill="#527FFF">Availability Zone 2</text>

  <!-- App subnet AZ1 -->
  <rect x="56" y="160" width="248" height="130" fill="#FFF4E5" stroke="#D97A06" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="66" y="182" font-size="12" font-weight="bold" fill="#D97A06">App Subnet (private)</text>
  <!-- EC2 icons -->
  <g>
    <rect x="72" y="196" width="52" height="40" rx="4" fill="#FF9900" stroke="#B26A00"/>
    <rect x="78" y="202" width="40" height="6" fill="#fff"/><rect x="78" y="212" width="40" height="6" fill="#fff"/><rect x="78" y="222" width="24" height="6" fill="#fff"/>
    <text x="72" y="252" font-size="11" fill="#232F3E">Amazon EC2</text>
    <text x="72" y="266" font-size="10" font-style="italic" fill="#555">App servers</text>
    <rect x="140" y="196" width="52" height="40" rx="4" fill="#FF9900" stroke="#B26A00"/>
    <rect x="146" y="202" width="40" height="6" fill="#fff"/><rect x="146" y="212" width="40" height="6" fill="#fff"/><rect x="146" y="222" width="24" height="6" fill="#fff"/>
    <text x="140" y="252" font-size="11" fill="#232F3E">Amazon EBS</text>
    <text x="140" y="266" font-size="10" font-style="italic" fill="#555">Volumes</text>
    <rect x="212" y="196" width="52" height="40" rx="4" fill="#3CAF91" stroke="#1E7A5A"/>
    <path d="M238 204 c-8 0 -14 5 -14 12 c0 8 7 10 14 14 c7 -4 14 -6 14 -14 c0 -7 -6 -12 -14 -12z" fill="#fff"/>
    <text x="212" y="252" font-size="11" fill="#232F3E">Amazon EFS</text>
    <text x="212" y="266" font-size="10" font-style="italic" fill="#555">Shared storage</text>
  </g>

  <!-- DB subnet AZ1 -->
  <rect x="56" y="306" width="248" height="130" fill="#EAF2FF" stroke="#527FFF" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="66" y="328" font-size="12" font-weight="bold" fill="#527FFF">DB Subnet (private)</text>
  <g>
    <rect x="72" y="342" width="52" height="40" rx="4" fill="#527FFF" stroke="#2F5FD0"/>
    <ellipse cx="98" cy="352" rx="14" ry="5" fill="#fff"/><path d="M84 352 v20 c0 3 6 6 14 6 s14 -3 14 -6 v-20" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="72" y="398" font-size="11" fill="#232F3E">Amazon RDS</text>
    <text x="72" y="412" font-size="10" font-style="italic" fill="#555">Database (primary)</text>
    <rect x="140" y="342" width="52" height="40" rx="4" fill="#527FFF" stroke="#2F5FD0"/>
    <ellipse cx="166" cy="352" rx="14" ry="5" fill="#fff"/><path d="M152 352 v20 c0 3 6 6 14 6 s14 -3 14 -6 v-20" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="140" y="398" font-size="11" fill="#232F3E">DynamoDB</text>
    <text x="140" y="412" font-size="10" font-style="italic" fill="#555">NoSQL tables</text>
    <rect x="212" y="342" width="52" height="40" rx="4" fill="#3CAF91" stroke="#1E7A5A"/>
    <path d="M238 350 c-9 0 -15 6 -15 13 c0 9 8 11 15 16 c7 -5 15 -7 15 -16 c0 -7 -6 -13 -15 -13z" fill="#fff"/>
    <text x="212" y="398" font-size="11" fill="#232F3E">Amazon S3</text>
    <text x="212" y="412" font-size="10" font-style="italic" fill="#555">Object storage</text>
  </g>

  <!-- AZ2 mirrors: standby resources -->
  <rect x="356" y="160" width="248" height="130" fill="#FFF4E5" stroke="#D97A06" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="366" y="182" font-size="12" font-weight="bold" fill="#D97A06">App Subnet (private)</text>
  <g>
    <rect x="372" y="196" width="52" height="40" rx="4" fill="#FF9900" stroke="#B26A00"/>
    <rect x="378" y="202" width="40" height="6" fill="#fff"/><rect x="378" y="212" width="40" height="6" fill="#fff"/><rect x="378" y="222" width="24" height="6" fill="#fff"/>
    <text x="372" y="252" font-size="11" fill="#232F3E">Amazon EC2</text>
    <text x="372" y="266" font-size="10" font-style="italic" fill="#555">App servers</text>
    <rect x="440" y="196" width="52" height="40" rx="4" fill="#FF9900" stroke="#B26A00"/>
    <rect x="446" y="202" width="40" height="6" fill="#fff"/><rect x="446" y="212" width="40" height="6" fill="#fff"/><rect x="446" y="222" width="24" height="6" fill="#fff"/>
    <text x="440" y="252" font-size="11" fill="#232F3E">Amazon EBS</text>
    <text x="440" y="266" font-size="10" font-style="italic" fill="#555">Volumes</text>
  </g>
  <rect x="356" y="306" width="248" height="130" fill="#EAF2FF" stroke="#527FFF" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="366" y="328" font-size="12" font-weight="bold" fill="#527FFF">DB Subnet (private)</text>
  <g>
    <rect x="372" y="342" width="52" height="40" rx="4" fill="#527FFF" stroke="#2F5FD0"/>
    <ellipse cx="398" cy="352" rx="14" ry="5" fill="#fff"/><path d="M384 352 v20 c0 3 6 6 14 6 s14 -3 14 -6 v-20" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="372" y="398" font-size="11" fill="#232F3E">Amazon RDS</text>
    <text x="372" y="412" font-size="10" font-style="italic" fill="#555">Database (standby)</text>
  </g>

  <!-- AWS Backup control plane (center bottom of primary region) -->
  <rect x="180" y="452" width="300" height="86" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/>
  <rect x="196" y="468" width="52" height="40" rx="4" fill="#FF9900" stroke="#B26A00"/>
  <path d="M222 476 v10 l-8 -5 z M222 476 v10 l8 -5 z" fill="#fff"/>
  <rect x="212" y="486" width="20" height="4" fill="#fff"/>
  <text x="258" y="484" font-size="13" font-weight="bold" fill="#232F3E">AWS Backup</text>
  <text x="258" y="502" font-size="11" fill="#555">Backup plan: daily 02:00 UTC</text>
  <text x="258" y="518" font-size="11" fill="#555">Tag selection: Backup = daily</text>

  <!-- Backup Vault (primary) -->
  <rect x="180" y="556" width="300" height="66" fill="#EAF2FF" stroke="#527FFF" stroke-width="2"/>
  <rect x="196" y="570" width="46" height="38" rx="4" fill="#527FFF" stroke="#2F5FD0"/>
  <rect x="208" y="580" width="22" height="16" fill="#fff"/><path d="M212 580 v-4 a7 7 0 0 1 14 0 v4" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="254" y="588" font-size="13" font-weight="bold" fill="#232F3E">Backup Vault — prod-vault</text>
  <text x="254" y="606" font-size="11" fill="#555">KMS encrypted · Vault Lock (Compliance)</text>

  <!-- Arrows: resources -> AWS Backup -->
  <line x1="180" y1="300" x2="300" y2="452" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="300" x2="360" y2="452" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="392" font-size="10" fill="#333">snapshots</text>
  <text x="440" y="392" font-size="10" fill="#333">snapshots</text>
  <!-- Arrow: Backup -> Vault -->
  <line x1="330" y1="538" x2="330" y2="556" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="552" font-size="10" fill="#333">recovery points</text>

  <!-- ============ DR REGION ============ -->
  <rect x="680" y="80" width="300" height="560" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="696" y="106" font-size="15" font-weight="bold" fill="#232F3E">DR Region — ap-southeast-2</text>

  <rect x="700" y="120" width="260" height="180" fill="#F2F8FF" stroke="#527FFF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="716" y="144" font-size="13" font-weight="bold" fill="#527FFF">DR Availability Zone</text>
  <rect x="716" y="160" width="228" height="120" fill="#EAF2FF" stroke="#527FFF" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="726" y="182" font-size="12" font-weight="bold" fill="#527FFF">DR Backup Vault — dr-vault</text>
  <rect x="732" y="196" width="46" height="38" rx="4" fill="#527FFF" stroke="#2F5FD0"/>
  <rect x="744" y="206" width="22" height="16" fill="#fff"/><path d="M748 206 v-4 a7 7 0 0 1 14 0 v4" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="788" y="212" font-size="11" fill="#232F3E">Cross-region copy</text>
  <text x="788" y="228" font-size="11" fill="#555">90-day retention</text>
  <text x="788" y="244" font-size="11" fill="#555">Vault Lock enabled</text>
  <text x="726" y="266" font-size="11" font-style="italic" fill="#555">Isolated copy — survives region outage</text>

  <!-- Restore drill box -->
  <rect x="700" y="330" width="260" height="150" fill="#FFF4E5" stroke="#D97A06" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="716" y="354" font-size="13" font-weight="bold" fill="#D97A06">Restore Drill (monthly)</text>
  <g font-size="11" fill="#232F3E">
    <text x="716" y="378">1. Restore RDS snapshot → temp DB</text>
    <text x="716" y="398">2. Restore EC2 AMI → temp instance</text>
    <text x="716" y="418">3. Sanity checks (row counts, boot)</text>
    <text x="716" y="438">4. Measure RTO / RPO, then clean up</text>
  </g>
  <text x="716" y="464" font-size="11" font-weight="bold" fill="#D97A06">Target: RTO &lt; 4 h · RPO &lt; 24 h</text>

  <!-- Monitoring box -->
  <rect x="700" y="500" width="260" height="120" fill="#F2F8FF" stroke="#527FFF" stroke-width="1.5"/>
  <text x="716" y="524" font-size="13" font-weight="bold" fill="#527FFF">Monitoring &amp; Alerts</text>
  <g font-size="11" fill="#232F3E">
    <text x="716" y="548">Amazon EventBridge: job FAILED</text>
    <text x="716" y="568">→ Amazon SNS → on-call channel</text>
    <text x="716" y="588">AWS Backup Audit Manager:</text>
    <text x="716" y="604">compliance report (daily)</text>
  </g>

  <!-- Cross-region copy arrow -->
  <path d="M 640 589 C 660 589 660 200 700 200" fill="none" stroke="#527FFF" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="646" y="380" font-size="11" font-weight="bold" fill="#527FFF">cross-region</text>
  <text x="646" y="396" font-size="11" font-weight="bold" fill="#527FFF">copy</text>

  <!-- Restore arrow: DR vault -> restore drill -->
  <line x1="830" y1="300" x2="830" y2="330" stroke="#D97A06" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840" y="320" font-size="10" fill="#333">restore</text>

  <!-- Legend -->
  <rect x="20" y="680" width="960" height="180" fill="#F7F7F7" stroke="#CCC" stroke-width="1"/>
  <text x="36" y="706" font-size="14" font-weight="bold" fill="#232F3E">How to read this diagram</text>
  <g font-size="12" fill="#232F3E">
    <text x="36" y="732">• Orange = compute &amp; backup control plane (EC2, EBS, AWS Backup) · Blue = database &amp; vaults (RDS, DynamoDB, Backup Vault)</text>
    <text x="36" y="754">• Green = storage (EFS, S3) · Dashed boxes = Availability Zones and subnets · Arrows = backup &amp; restore data flow</text>
    <text x="36" y="776">• Traffic flow: Protected resources → AWS Backup plan (daily) → prod-vault (Vault Lock) → cross-region copy to dr-vault</text>
    <text x="36" y="798">• Restore flow: dr-vault / prod-vault → restore drill in DR region → validate RTO/RPO before the real incident</text>
    <text x="36" y="820">• Golden rule: a backup is only real after a successful restore test. Vault Lock + cross-account copy = ransomware-proof.</text>
  </g>
  <text x="36" y="850" font-size="11" fill="#888">Style: classic AWS reference architecture — white background, official service colors, dashed AZ boxes, labeled tiered subnets.</text>
</svg>
